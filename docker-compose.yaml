services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: api
        depends_on:
            postgres:
                condition: service_healthy
        env_file: ['.env']
        environment:
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
        ports:
            - '${APP_PORT}:7614'
        networks:
            - backend

    postgres:
        image: postgres:18-alpine
        container_name: postgres
        restart: always
        ports:
            - '${POSTGRES_PORT}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/18
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        networks:
            - backend
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:

networks:
    backend:
